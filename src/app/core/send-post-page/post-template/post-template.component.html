<div class="post" *ngFor="let post of posts; let i = index">
  <div class="post__left">
    <div class="post-info">
      <app-profile-photo>
      </app-profile-photo>
      <div>
        <p class="author">{{post.author }}</p>
        <p class="date">{{post.time }}</p>
      </div>
    </div>
  </div>
  <div class="post__lower">
    <p class="post-text">
      {{ post.text }}
    </p>
    <img class="post-image" src="{{post.photo}}" alt="">
  </div>
  <i class="fa-regular fa-heart" (click)="likedPost(post.id - 1)" [class.liked]="post.liked"></i>
</div>
